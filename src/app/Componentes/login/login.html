<div class="fondo">
    <div class="container">
        <form class="contenedorExterno" [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="row text-center">
                <div class="col">
                    <img class="logo"
                        src="https://th.bing.com/th/id/R.ddd5084dff8d7606019645f62c1712c6?rik=RJm8gtkd41am8Q&riu=http%3a%2f%2fpluspng.com%2fimg-png%2fpokemon-logo-png-pokemon-logo-png-2000.png&ehk=%2bFdpvqx7Vk1jcWsSaxVIqArQSByK89fRtNQoRFktAhY%3d&risl=&pid=ImgRaw&r=0">
                </div>
            </div>
            <div class="row text-center">
                <div class="col">
                    <h4 class="text-light">Inicio de sesion</h4>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-3 margenes">
                    <input type="text " class="form-control text-center" placeholder="Correo" formControlName="correo"
                        required="true">

                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-3  col-md-3 col-sm-5  margenes">
                    <input type="password" class="form-control text-center" placeholder="Contraseña" formControlName="contraseña"
                        required="true">

                </div>
            </div>
            @if(!correcto){
            <div class="row text-center">
                <p class="text-danger">Usuario o contraseña incorrectos</p>
            </div>
            }
            <div class="row text-center">
                <div class="col">
                    <button type="submit" class="btn btn-warning margenes"><i class="bi bi-box-arrow-right"></i>
                        Ingresar</button>
                </div>
            </div>
            <div class="row text-center">
                <div class="col">
                    <h6 class="text-light margenes">¿Aun no tiene cuenta?</h6>
                </div>
            </div>
            <div class="row text-center">
                <div class="col">
                    <a class="text-light margenes" [routerLink]="['/registro']">Crea una</a>
                </div>
            </div>
            <div class="row text-center">
                <div class="col">
                    <img class="imagenInferior"
                        src="https://th.bing.com/th/id/R.f97f5c6510994f677877b08320475008?rik=6KPQtB5WuKJ76Q&riu=http%3a%2f%2ffc04.deviantart.net%2ffs71%2ff%2f2013%2f019%2f2%2f7%2fpokeball_by_zel_duh-d5s04qj.gif&ehk=8UFPaRN8z9J50cxA4WMUQkZ2KBSHryEFwbldNMSuOaU%3d&risl=&pid=ImgRaw&r=0">
                </div>
            </div>
        </form>
    </div>
</div>
