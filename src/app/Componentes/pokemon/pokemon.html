<div class="fondo">
    <div class="container">
        <form [formGroup]="form" (submit)="busqueda()">
            <div class="contenedorExterno row">
                <div class="col">
                    <h3 class="text-dark">Pokedex</h3>
                </div>
                <div class="col-2">
                    <select class="form-select" aria-label="Default select example" formControlName="Region">
                        <option selected [ngValue]="RegionDefecto">Region</option>
                        @for (region of regiones; track region.id) {
                        <option [ngValue]="region">{{region.Nombre}}</option>
                        }
                    </select>
                </div>
                <div class="col-2">
                    <select class="form-select" aria-label="Default select example" formControlName="Generacion">
                        <option selected [ngValue]="GeneracionDefecto">Generacion</option>
                        @for (generacion of generaciones; track generacion.Id) {
                        <option [ngValue]="generacion">{{generacion.Id}}</option>
                        }
                    </select>
                </div>
                <div class="col-2">
                    <select class="form-select" aria-label="Default select example" formControlName="Tipos">
                        <option selected [ngValue]="TipoDefecto">Tipo</option>
                        @for (tipo of tipos; track tipo.Id) {
                        <option [ngValue]="tipo"> {{tipo.Nombre}}</option>
                        }
                    </select>
                </div>
                <div class="col-2">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="Nombre" aria-label="Recipient’s username"
                            aria-describedby="button-addon2" formControlName="Nombre">
                        <button class="btn btn-light" type="submit" id="button-addon2"><i
                                class="bi bi-search"></i></button>
                    </div>
                </div>
            </div>
        </form>
        @if(pokemons){
        <div class="contenedorCartas py-4">
            <div class="container mt-4">
                <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                    @for (pokemon of pokemons; track pokemon.Id) {
                    <div class="col">
                        <app-pokemon-carta [pokemon]="pokemon"
                            [routerLink]="['/pokemon/',pokemon.Id]"></app-pokemon-carta>
                    </div>
                    }
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <button class="btn btn-warning" (click)="cambioPagina('ant')"><i class="bi bi-arrow-left"></i></button>
            </div>
            <div class="col">
                <button class="btn btn-warning" (click)="cambioPagina('sig')"><i class="bi bi-arrow-right"></i></button>
            </div>
        </div>
        }@else {
        <div class="row">
            <img src="https://levelup-games.co.uk/images/poke_loading.gif">
        </div>
        }
    </div>
</div>
